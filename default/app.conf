#
# Eventgen Manager
# Configure, preview, and generate eventgen.conf test data with a built-in engine.
#
# Do not edit this file. Copy any stanza you want to change into
# $SPLUNK_HOME/etc/apps/eventgen_manager/local/app.conf and edit it there.
#

[id]
name = eventgen_manager
version = 2.0.0

[install]
is_configured = false
state = enabled
build = 7

[launcher]
author = Kamal Singh Bisht
version = 2.0.0
description = Configure, preview, and generate realistic test data from the browser, with a built-in engine. No SA-Eventgen required, and no more hand-editing eventgen.conf.

[package]
id = eventgen_manager
check_for_updates = true

[ui]
is_visible = true
label = Eventgen Manager
docs_section_override = AddOns

[triggers]
# Picking up UI-authored stanzas must not require a Splunk restart.
reload.eventgen = simple
