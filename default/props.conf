#
# The engine's own log. Lines are key="value" pairs, which Splunk extracts
# without further configuration.
#

[source::...eventgen_manager_engine.log*]
sourcetype = eventgen_manager:engine
priority = 100

[eventgen_manager:engine]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
KV_MODE = auto
