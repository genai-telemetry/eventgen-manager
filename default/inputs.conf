#
# The Eventgen Manager built-in engine.
#
# One input runs every eventgen.conf configuration on this instance. It ships
# turned on, but every starter configuration ships turned off, so nothing is
# generated until you start one on the Configurations page.
#
# If SA-Eventgen's own modular input is also running, this engine stays on
# standby so no event is generated twice. Generator control explains how to
# switch over.
#

[eventgen_manager_engine]
python.version = python3
python.required = 3.13

[eventgen_manager_engine://default]
disabled = 0
log_level = INFO
reload_interval = 10
